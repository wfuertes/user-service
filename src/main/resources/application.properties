quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=2

quarkus.datasource.jdbc.transactions=enabled
quarkus.native.additional-build-args=--initialize-at-run-time=com.github.f4b6a3.uuid,--initialize-at-run-time=org.jboss.resteasy.plugins.providers.RegisterBuiltin

%test.quarkus.datasource.devservices.reuse=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true

user-service.security.argon2.memory=65536
user-service.security.argon2.iterations=3
user-service.security.argon2.parallelism=4